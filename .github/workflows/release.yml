# Builds the Windows installers on a Windows runner and leaves them as a draft
# release on GitHub, using the repository's own token and
# tools/publish-release.js, so the release body comes from
# docs/releases/<tag>.md and the update feed (latest.yml) and the blockmap go
# up with the installers. A draft is seen by nobody. It is signed and published
# from the release PC (--sign), so the key that installed copies trust is never
# on this runner.
#
# Run it from the Actions tab (workflow_dispatch) on the branch to release;
# the tag is v<version> from package.json, created by the release if it is
# not there yet, at the commit the workflow ran on.
name: release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

# A tag and a manual run of the same version wait for each other: one draft, one build at a time.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      # Each app's pack is signed with the release key, kept as the repository
      # secret RUTBA_PACK_KEY. Without it the build cannot finish, so the run
      # stops here rather than after the tests (2.20.0 was built by hand).
      - name: The release key is there
        shell: bash
        env:
          RUTBA_PACK_KEY: ${{ secrets.RUTBA_PACK_KEY }}
        run: |
          if [ -z "$RUTBA_PACK_KEY" ]; then
            echo "::error::The repository secret RUTBA_PACK_KEY is not set, so the app packs cannot be signed. Add it, or build the release on the release computer (docs/APP-PACKS.md)."
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          # The templates are their own repository (Rutba-Office-Templates), taken as packages/templates.
          submodules: true
          # Publishing compares this commit with the one the gate checked.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The pack tests build packs from the renderer's build (build/meta/renderer.json),
      # which a fresh checkout does not have: it is made here first.
      - name: The renderer's build
        working-directory: apps/desktop
        run: node build/bundle.js
      # The engine reads 3/4/2026 in the computer's own date order, as Excel does,
      # and the Excel answers the tests hold (tests/fixtures/excel-answers) were
      # recorded on a computer set to English (United Kingdom). The runner is
      # set to the United States, so it is set as the answers were, and checked.
      - name: Dates read as the Excel answers were recorded
        shell: pwsh
        run: |
          Set-Culture en-GB
          $order = node -e "console.log(new Intl.DateTimeFormat(undefined,{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(Date.UTC(2001,10,22,12))))"
          if ($order -ne '22/11/2001') { Write-Output "::error::Dates still read as $order, not day first."; exit 1 }
      - name: Engine tests
        run: npm test
      - name: Performance budgets, run alone
        run: npm run test:perf
      - name: Build the installers
        # Each app's pack is signed with the release key (docs/APP-PACKS.md),
        # kept as the repository secret RUTBA_PACK_KEY; without it the build stops.
        # So does the secret RUTBA_GOOGLE_CLIENT (docs/OAUTH.md), the Google client
        # as a file holds it: a build without it has no Google sign-in in Mail.
        env:
          RUTBA_PACK_KEY: ${{ secrets.RUTBA_PACK_KEY }}
          RUTBA_GOOGLE_CLIENT: ${{ secrets.RUTBA_GOOGLE_CLIENT }}
        shell: bash
        run: |
          if [ -z "$RUTBA_GOOGLE_CLIENT" ]; then
            echo "::error::The repository secret RUTBA_GOOGLE_CLIENT is not set, so this build would have no Google sign-in in Mail."
            exit 1
          fi
          printf '%s' "$RUTBA_GOOGLE_CLIENT" > "$RUNNER_TEMP/google-client.json"
          RUTBA_GOOGLE_CLIENT_FILE="$RUNNER_TEMP/google-client.json" npm run dist:win
          rm -f "$RUNNER_TEMP/google-client.json"
      # Beside the installers, so it goes up with them (docs/REPRODUCIBLE.md).
      - name: The software bill of materials
        run: node tools/sbom.mjs
      - name: Leave the release as a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A tag pushed names the version; run by hand, package.json does.
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node tools/publish-release.js ${{ env.TAG }}
