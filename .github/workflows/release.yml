# Builds the Windows installers on a Windows runner and publishes them as a
# pre-release on GitHub, using the repository's own token — the same
# tools/publish-release.js the owner runs by hand, so the release body comes
# from docs/releases/<tag>.md and the update feed (latest.yml) and the
# blockmap go up with the installers.
#
# Run it from the Actions tab (workflow_dispatch) on the branch to release;
# the tag is v<version> from package.json, created by the release if it is
# not there yet, at the commit the workflow ran on.
name: release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      # Each app's pack is signed with the release key, kept as the repository
      # secret RUTBA_PACK_KEY. Without it the build cannot finish, so the run
      # stops here rather than after the tests (2.20.0 was built by hand).
      - name: The release key is there
        shell: bash
        env:
          RUTBA_PACK_KEY: ${{ secrets.RUTBA_PACK_KEY }}
        run: |
          if [ -z "$RUTBA_PACK_KEY" ]; then
            echo "::error::The repository secret RUTBA_PACK_KEY is not set, so the app packs cannot be signed. Add it, or build the release on the release computer (docs/APP-PACKS.md)."
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          # The templates are their own repository (Rutba-Office-Templates), taken as packages/templates.
          submodules: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Engine tests
        run: npm test
      - name: Performance budgets, run alone
        run: npm run test:perf
      - name: Build the installers
        # Each app's pack is signed with the release key (docs/APP-PACKS.md),
        # kept as the repository secret RUTBA_PACK_KEY; without it the build stops.
        env:
          RUTBA_PACK_KEY: ${{ secrets.RUTBA_PACK_KEY }}
        run: npm run dist:win
      # Beside the installers, so it goes up with them (docs/REPRODUCIBLE.md).
      - name: The software bill of materials
        run: node tools/sbom.mjs
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/publish-release.js
