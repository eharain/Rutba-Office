# The upgrade test on a Windows runner (tools/upgrade-test.js): the previous
# release's profile opened by the newest one, settings, the recent list and
# the arrival record kept, and the newest one's updater reading the release
# feed. Twice: installed (the older installer, then the newer over it, the
# registry left with one copy of the newer version), and as the portable
# executables, the way the test runs on a desk.
#
# It runs by itself after the release workflow publishes, and from the
# Actions tab (workflow_dispatch) for any two releases. It only reads the
# releases; it publishes nothing and changes nothing in release.yml.
# workflow_run fires only for the copy of this file on the default branch.
name: upgrade

on:
  workflow_dispatch:
    inputs:
      from:
        description: 'The release to upgrade from, a tag such as v1.51.0 (empty: the one before "to")'
        required: false
        default: ''
      to:
        description: 'The release to upgrade to, a tag (empty: the newest published)'
        required: false
        default: ''
  workflow_run:
    workflows: [release]
    types: [completed]

permissions:
  contents: read

jobs:
  windows:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [installed, portable]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # The test needs only node's own modules: no npm ci.
      - name: Upgrade, ${{ matrix.mode }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
        run: |
          $to = if ($env:TO) { $env:TO } else { 'newest' }
          $testArgs = @('tools/upgrade-test.js', '--to', $to, '--open-file', '--out', "$env:RUNNER_TEMP\upgrade-${{ matrix.mode }}.json")
          if ($env:FROM) { $testArgs += @('--from', $env:FROM) }
          if ('${{ matrix.mode }}' -eq 'installed') { $testArgs += '--install' }
          node @testArgs
          exit $LASTEXITCODE
      - name: Keep the verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-${{ matrix.mode }}
          path: ${{ runner.temp }}/upgrade-${{ matrix.mode }}.json
          if-no-files-found: ignore
