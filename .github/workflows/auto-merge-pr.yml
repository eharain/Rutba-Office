name: Auto Merge PRs

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: ${{ github.event.pull_request.state == 'open' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository && ((vars.AUTO_MERGE_ALLOWED_USER != '' && ((startsWith(vars.AUTO_MERGE_ALLOWED_USER, '@') && format('@{0}', github.actor) == vars.AUTO_MERGE_ALLOWED_USER) || (!startsWith(vars.AUTO_MERGE_ALLOWED_USER, '@') && github.actor == vars.AUTO_MERGE_ALLOWED_USER))) || (vars.AUTO_MERGE_ALLOWED_USER == '' && github.actor == 'eharain')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge (squash)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge --auto --squash "$PR_URL"
