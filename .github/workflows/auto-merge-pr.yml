name: Auto Merge PRs

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve allowed actor
        id: policy
        run: |
          allowed="${{ vars.AUTO_MERGE_ALLOWED_USER }}"
          if [ -z "$allowed" ]; then
            allowed="eharain"
          fi
          allowed="${allowed#@}"
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge (squash)
        if: ${{ github.event.pull_request.state == 'open' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository && github.actor == steps.policy.outputs.allowed }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge --auto --squash "$PR_URL"
