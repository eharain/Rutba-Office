name: AI Footprint Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Check for AI footprints in commits and changed files
        run: |
          git fetch --no-tags --prune --depth=1 origin "${{ github.event.pull_request.base.ref }}"
          BASE_SHA="$(git merge-base 'origin/${{ github.event.pull_request.base.ref }}' '${{ github.event.pull_request.head.sha }}')"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          SCRIPT_PATH="/tmp/ai-footprint-guard.sh"
          if git cat-file -e '${{ github.event.pull_request.base.sha }}:tools/ci/ai-footprint-guard.sh' 2>/dev/null; then
            git show '${{ github.event.pull_request.base.sha }}:tools/ci/ai-footprint-guard.sh' > "$SCRIPT_PATH"
          else
            echo "Trusted guard script not found on base branch; refusing to run untrusted PR-branch script." >&2
            exit 1
          fi
          chmod +x "$SCRIPT_PATH"
          bash "$SCRIPT_PATH" "$BASE_SHA" "$HEAD_SHA"
