# A release candidate's installer proven on a clean Windows runner before
# anything is published. The build is this branch's, its packs signed with a
# key made for the run and thrown away after it, so the installer, the packs
# and the core are the release's in everything but the key. Beside the build,
# the engine tests run as the release runs them (engine), so a change that
# passes on the release PC and not on a clean runner is found here, not by the
# release: 2.25.0's Locker refused every open on the runner's administrator
# account, and only the release build saw it. Then, each on a machine of its
# own:
#
#   installed           the previous release's installer, then this one over it
#   portable            the two portable executables on one profile
#   race-close          this installer started while the older copy is open
#   race-never-close    the same, the older copy never closed
#   short-list          this installer alone with /PACKS=word,sheets
#
# The upgrade modes are tools/upgrade-test.js, as upgrade.yml runs them after
# a release; short-list is tools/install-short-list.ps1. It publishes
# nothing. Run it from the Actions tab or `gh workflow run candidate.yml`.
name: candidate

on:
  workflow_dispatch:
    inputs:
      from:
        description: 'The release to upgrade from, a tag (empty: the newest published)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  # The steps release.yml runs before its tests, then its tests.
  engine:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The renderer's build
        working-directory: apps/desktop
        run: node build/bundle.js
      - name: Dates read as the Excel answers were recorded
        shell: pwsh
        run: |
          Set-Culture en-GB
          $order = node -e "console.log(new Intl.DateTimeFormat(undefined,{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(Date.UTC(2001,10,22,12))))"
          if ($order -ne '22/11/2001') { Write-Output "::error::Dates still read as $order, not day first."; exit 1 }
      - name: Engine tests
        run: npm test

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: A pack key for this run only
        shell: pwsh
        run: node tools/make-pack-key.mjs "$env:RUNNER_TEMP\pack-key"
      - name: Build the installers
        shell: pwsh
        run: |
          $env:RUTBA_PACK_KEY_FILE = "$env:RUNNER_TEMP\pack-key\pack-key.pem"
          npm run dist:win
      - name: The packs check
        run: node tools/check-packs.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: candidate
          path: |
            apps/desktop/release/Rutba-Office-*-win-x64.exe
            apps/desktop/release/Rutba-Office-*-win-x64.exe.blockmap
            apps/desktop/release/Rutba-Office-*-portable.exe
            apps/desktop/release/Rutba-Office-*.pack
            apps/desktop/release/latest.yml
          if-no-files-found: error

  install:
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [installed, all-users, portable, race-close, race-never-close, short-list]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        with:
          name: candidate
          path: apps/desktop/release
      - name: ${{ matrix.mode }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FROM: ${{ inputs.from }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ('${{ matrix.mode }}' -eq 'short-list') {
            powershell -NoProfile -ExecutionPolicy Bypass -File tools\install-short-list.ps1 -Installer "apps\desktop\release\Rutba-Office-$version-win-x64.exe"
            exit $LASTEXITCODE
          }
          $testArgs = @('tools/upgrade-test.js', '--open-file', '--out', "$env:RUNNER_TEMP\candidate-${{ matrix.mode }}.json")
          if ($env:FROM) { $testArgs += @('--from', $env:FROM) }
          switch ('${{ matrix.mode }}') {
            'installed' { $testArgs += '--install' }
            'all-users' { $testArgs += @('--install', '--all-users', '--race', 'close') }
            'race-close' { $testArgs += @('--install', '--race', 'close') }
            'race-never-close' { $testArgs += @('--install', '--race', 'never-close') }
          }
          node @testArgs
          exit $LASTEXITCODE
      - name: Keep the verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-${{ matrix.mode }}
          path: ${{ runner.temp }}/candidate-${{ matrix.mode }}.json
          if-no-files-found: ignore
